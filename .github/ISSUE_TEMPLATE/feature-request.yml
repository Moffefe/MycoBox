name: Feature request
description: Suggest an improvement or new capability for MycoBox
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem or use case first, then the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to achieve, and what limitation exists today?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web interface
        - Sensors
        - Environmental control
        - Zigbee / ESP32-H2
        - Wi-Fi / networking
        - Time / RTC / NTP
        - Firmware update
        - Cluster
        - Local display / joystick
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like MycoBox to behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe any workarounds or alternative approaches.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, hardware examples, diagrams or links can be useful here.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for similar requests.
          required: true
