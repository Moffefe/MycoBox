name: Documentation feedback
description: Report an unclear instruction, incorrect detail or broken link
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page or guide
      description: Paste its URL or give the guide title.
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What needs improving?
      description: Point to the unclear or incorrect part. Suggest a correction if you have one. No firmware version is required.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Do not include credentials or private device information. For security concerns, follow the [Security policy](https://github.com/Moffefe/MycoBox/blob/main/SECURITY.md).
