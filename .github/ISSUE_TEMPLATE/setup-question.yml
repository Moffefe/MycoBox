name: Setup or compatibility question
description: Ask about connecting, configuring or choosing compatible equipment
title: "[Help]: "
body:
  - type: markdown
    attributes:
      value: |
        Check [Getting started](https://moffefe.github.io/MycoBox/docs/getting-started.html), [Compatibility](https://moffefe.github.io/MycoBox/docs/compatibility.html) or [Troubleshooting](https://moffefe.github.io/MycoBox/docs/troubleshooting.html) first.
        Do not include passwords, keys, full device addresses or unreviewed diagnostic archives.
  - type: textarea
    id: question
    attributes:
      label: What would you like to do?
      description: Explain the setup or compatibility question and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Relevant setup
      description: If known, include controller versions, the exact equipment model and what you already tried. Leave out credentials.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sharing
      options:
        - label: I have removed credentials, secrets and identifying information.
          required: true
