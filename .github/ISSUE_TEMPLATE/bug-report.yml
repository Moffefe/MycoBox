name: Bug report
description: Report a reproducible problem with MycoBox
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail to reproduce it.

        For setup help, use [Setup or compatibility question](https://github.com/Moffefe/MycoBox/issues/new?template=setup-question.yml). For a guide correction, use [Documentation feedback](https://github.com/Moffefe/MycoBox/issues/new?template=documentation-feedback.yml); no firmware version is needed.

        Do not include passwords, keys, authentication headers or other sensitive information in a public issue. Share only short, reviewed event excerpts or cropped screenshots.

        For a suspected security vulnerability, follow the [Security Policy](https://github.com/Moffefe/MycoBox/blob/main/SECURITY.md) instead of posting exploit details here.

  - type: input
    id: version
    attributes:
      label: MycoBox firmware version
      description: Copy the version and build from System → Main Controller firmware. For Zigbee issues, also include Zigbee → Advanced firmware information.
      placeholder: "Main Controller: version / build; Zigbee Controller: version / build"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web interface / navigation
        - Overview / Growbox warnings
        - Measurements / SHT41
        - Cycle & automation
        - Zigbee / Zigbee Controller
        - Activity log
        - Wi-Fi / networking
        - Time / RTC / NTP
        - Firmware update
        - Cluster
        - Local display / joystick
        - Other
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware / setup
      description: Include the relevant sensor, exact model of the paired Zigbee outlet or power strip, detected output and assignment. Do not include credentials or full device addresses.
      placeholder: |
        Sensor: SHT41
        Zigbee device: manufacturer + exact model
        Detected output: Output 1
        Assignment: Humidifier / Fan / Light / Heat
        Mode: Fruiting / Incubation; Timer / Adaptive
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Press ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant events / screenshots
      description: Include the relevant Activity log description and, if useful, reviewed Technical details or a cropped screenshot. Remove passwords, keys, authentication headers, network names and identifying addresses. Do not attach complete dumps or unreviewed logs.
      render: shell
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / client
      description: Relevant for web-interface issues.
      placeholder: Browser name and version / phone or computer / operating system
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues for the same problem.
          required: true
        - label: I have removed passwords, tokens, encryption keys and other secrets from this report.
          required: true
